apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }
        location /health {
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }
    }
  app.properties: |
    app.name=nginx-app
    app.version=2.0
    debug=true
    environment=development
  database.properties: |
    db.host=localhost
    db.port=5432
    db.name=myapp
